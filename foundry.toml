[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "v3-core/=lib/v3-core/"
]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 100000 # 2^32-1

[rpc_endpoints]
# MegaETH Mainnet (Chain ID: 4326)

# MegaETH Testnet (Chain ID: 6343)
mega_testnet = "https://timothy.megaeth.com/rpc"
mega_testnet_alchemy = "https://megaeth-testnet.g.alchemy.com/v2/${ALCHEMY_KEY}" # Alchemy
